<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arpan Cart — Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/"><span>ॐ</span><strong>Arpan Cart</strong><small>Admin Panel</small></a><nav><a href="/">Storefront</a></nav></header><main class="section"><label>CONTROL CENTRE</label><h1>Admin Dashboard</h1><div class="admin-tabs"><button class="btn primary" data-tab="products">Products & Inventory</button><button class="btn" data-tab="orders">Orders & Billing</button></div><section id="productsTab"><div class="admin-layout"><div class="panel"><h2>Add / Edit Product</h2><input id="pid" type="hidden"><label>Product name<input id="pn" placeholder="e.g. Fresh Marigold Flowers"></label><label>Category<select id="pc"><option value="flowers">Flowers</option><option value="kits">Puja Kits</option><option value="essentials">Essentials</option><option value="idols">Idols</option></select></label><div class="two"><label>Price (₹)<input id="pp" type="number" min="0"></label><label>Available items<input id="ps" type="number" min="0"></label></div><label>Description<textarea id="pd" rows="3"></textarea></label><label>Product image</label><div id="dropzone" class="dropzone">Drag & drop an image here<br><span>or click to choose a file</span><input id="pimg" type="file" accept="image/*" hidden></div><img id="preview" class="preview hidden"><div class="actions"><button class="btn primary" id="saveProduct">Save product</button><button class="btn" id="resetProduct">Clear</button></div></div><div class="panel"><h2>Inventory</h2><div id="inventory"></div></div></div></section><section id="ordersTab" class="hidden"><div class="panel"><div class="section-head"><div><label>ORDERS</label><h2>Order billing</h2></div><button class="btn" id="clearOrders">Clear all demo orders</button></div><div id="orders"></div></div></section></main><div id="toast"></div><script src="/admin.js"></script></body></html>
